<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static Ports</title>
<style>
    body {
        background-color: #001f3f;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
    }
    h1 { margin-bottom: 10px; }
    input {
        padding: 8px;
        font-size: 1em;
        margin-bottom: 20px;
        width: 300px;
        border: none;
        border-radius: 4px;
    }
    table {
        width: 100%;
        max-width: 800px;
        border-collapse: collapse;
        margin-bottom: 40px;
    }
    th, td {
        padding: 10px;
        text-align: left;
    }
    th {
        border-bottom: 2px solid white;
    }
    tr:nth-child(even) {
        background: rgba(255,255,255,0.05);
    }
    .stats {
        max-width: 800px;
        margin-bottom: 40px;
    }
</style>
</head>
<body>

<h1>Static Linux Ports</h1>
<input id="search" type="text" placeholder="Search ports...">

<div class="stats" id="stats"></div>

<table>
<thead>
<tr>
<th>Category</th>
<th>Name</th>
<th>Version</th>
<th>Author</th>
</tr>
</thead>
<tbody id="port-list"></tbody>
</table>

<script>
const ports = [
    {category: "shells", name: "dash", version: "0.5.12", author: "alice"},
    {category: "utils", name: "coreutils", version: "9.2", author: "bob"},
    {category: "editors", name: "nano", version: "7.2", author: "alice"},
    {category: "shells", name: "bash", version: "5.3", author: "carol"}
];

const tbody = document.getElementById('port-list');
function renderPorts(list) {
    tbody.innerHTML = '';
    list.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.category}</td><td>${p.name}</td><td>${p.version}</td><td>${p.author}</td>`;
        tbody.appendChild(tr);
    });
}
renderPorts(ports);


document.getElementById('search').addEventListener('input', e => {
    const term = e.target.value.toLowerCase();
    renderPorts(ports.filter(p => p.name.includes(term) || p.category.includes(term)));
});


const statsDiv = document.getElementById('stats');
const authors = {};
ports.forEach(p => authors[p.author] = (authors[p.author]||0)+1);
const topAuthor = Object.entries(authors).sort((a,b)=>b[1]-a[1])[0];
statsDiv.innerHTML = `<strong>Top Contributor:</strong> ${topAuthor[0]} (${topAuthor[1]} ports)`;
</script>

</body>
</html>
