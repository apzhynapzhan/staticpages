<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Linux</title>
    <style>
        body {
            background-color: #001f3f;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: left;
        }

        header {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        header h1 {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0;
        }

        nav {
            margin-top: 5px;
            font-size: 0.9em;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .main-content {
            max-width: 600px;
            padding-left: 20px;
            padding-right: 20px;
            line-height: 1.6;
            font-size: 1.2em;
        }
    </style>
</head>
